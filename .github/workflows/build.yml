name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libibus-1.0-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libsndio-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            wayland-protocols

      - name: Install CMake
        run: |
          python3 -m pip install --user "cmake>=3.25,<4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package binaries
        run: |
          mkdir -p package/linux
          cp build/game_client package/linux/
          cp build/game_server package/linux/
          find build -name 'libSDL3.so*' -type f -exec cp -P {} package/linux/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-sandbox-game-linux
          path: package/linux/

  windows:
    name: Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v143 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

      - name: Build
        run: cmake --build build --config Release

      - name: Package binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/windows | Out-Null
          Copy-Item build/Release/game_client.exe package/windows/
          Copy-Item build/Release/game_server.exe package/windows/
          Get-ChildItem -Path build -Recurse -Filter SDL3.dll | ForEach-Object { Copy-Item $_.FullName package/windows/ }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-sandbox-game-windows
          path: package/windows/
