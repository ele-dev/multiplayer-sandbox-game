name: Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libprotobuf-dev \
            libssl-dev \
            file \
            libfuse2 \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            libasound2-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libibus-1.0-dev \
            libjack-jackd2-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libsndio-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            wayland-protocols

      - name: Install CMake
        run: |
          python3 -m pip install --user "cmake>=3.25,<4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          build_jobs=$(nproc)
          build_jobs=$(( build_jobs > 1 ? build_jobs / 2 : 1 ))
          cmake --build build --parallel "$build_jobs"

      - name: Package AppImages
        run: |
          chmod +x packaging/linux/build-appimages.sh
          packaging/linux/build-appimages.sh

      - name: Upload client AppImage
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-sandbox-game-client-linux-appimage
          path: package/linux/*client*.AppImage

      - name: Upload server AppImage
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-sandbox-game-server-linux-appimage
          path: package/linux/*server*.AppImage

  windows:
    name: Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: vcpkg install protobuf:x64-windows

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -T v143
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: |
          $buildJobs = [Math]::Max(1, [Math]::Floor([Environment]::ProcessorCount / 2))
          cmake --build build --config Release --parallel $buildJobs

      - name: Package binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/windows | Out-Null
          Copy-Item build/Release/game_client.exe package/windows/
          Copy-Item build/Release/game_server.exe package/windows/
          Copy-Item server.cfg package/windows/
          Get-ChildItem -Path build -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName package/windows/ }
          Get-ChildItem -Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" -Filter *.dll | ForEach-Object { Copy-Item $_.FullName package/windows/ }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-sandbox-game-windows
          path: package/windows/
